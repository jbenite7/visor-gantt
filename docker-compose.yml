services:
  frontend:
    build:
      context: ./v2
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_MPP_PARSER_URL=http://mpp-parser:8000
      - DATABASE_URL=postgresql://visoruser:visorpass@db:5432/visormpp
    depends_on:
      mpp-parser:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  mpp-parser:
    build:
      context: ./services/mpp-parser
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MPXJ_TIMEOUT=${MPXJ_TIMEOUT:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: visormpp
      POSTGRES_USER: visoruser
      POSTGRES_PASSWORD: visorpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visoruser -d visormpp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./v2/scripts/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
