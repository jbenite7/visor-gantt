services:
  frontend:
    build:
      context: ./v2
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_MPP_PARSER_URL=http://mpp-parser:8000
    depends_on:
      mpp-parser:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: 
      context: ./docker
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/frontend/public
      - DB_HOST=db
      - DB_NAME=visormpp
      - DB_USER=visoruser
      - DB_PASS=visorpass
    depends_on:
      - db

  mpp-parser:
    build:
      context: ./services/mpp-parser
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/mpp-parser/libs:/app/libs
    environment:
      - MPXJ_JAR_PATH=/app/libs/mpxj.jar
      - MPXJ_TIMEOUT=${MPXJ_TIMEOUT:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: visormpp
      POSTGRES_USER: visoruser
      POSTGRES_PASSWORD: visorpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
