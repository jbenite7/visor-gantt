services:
  frontend:
    build:
      context: ./v2
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_MPP_PARSER_URL=${NEXT_PUBLIC_MPP_PARSER_URL:-/api/parse-mpp}
      - MPP_PARSER_URL=${MPP_PARSER_URL:-http://mpp-parser:8000}
      - DATABASE_URL=${DATABASE_URL:-postgresql://visoruser:visorpass@db:5432/visormpp}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@example.com}
      # Sin valor por defecto a propósito. Era `admin123`, y desde que el
      # admin ve y edita CUALQUIER proyecto eso es la llave maestra de la
      # instalación. Que el arranque falle con un mensaje claro es mejor final
      # que un despliegue con contraseña conocida.
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?define INITIAL_ADMIN_PASSWORD en tu .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-visorpass}
    depends_on:
      mpp-parser:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  mpp-parser:
    build:
      context: ./services/mpp-parser
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MPXJ_TIMEOUT=${MPXJ_TIMEOUT:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      # Interpoladas, como el resto del fichero. Estaban escritas literales
      # mientras `DATABASE_URL` sí interpolaba: cambiar la contraseña en el
      # `.env` no hacía nada, y cambiar además `DATABASE_URL` rompía la app sin
      # haber cambiado la contraseña real. Los valores por defecto son los de
      # siempre para no romper el entorno local de nadie.
      POSTGRES_DB: ${POSTGRES_DB:-visormpp}
      POSTGRES_USER: ${POSTGRES_USER:-visoruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visorpass}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visoruser -d visormpp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./v2/scripts/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    restart: unless-stopped

  # pgAdmin ya no se levanta por defecto: era una consola de administración de
  # la base publicada con credenciales conocidas y con ruta interna al servicio
  # `db`. Quien la quiera: `docker compose --profile admin up`.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?define PGADMIN_PASSWORD en tu .env}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
